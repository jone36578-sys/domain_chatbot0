<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ chatbot_title }}</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #182033;
      --muted: #697386;
      --border: #e5e9f2;
      --accent: #5b5bd6;
      --accent-dark: #4747b8;
      --user: #5b5bd6;
      --assistant: #f0f2f8;
      --danger: #b42318;
      --shadow: 0 20px 60px rgba(25, 32, 55, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(91, 91, 214, .12), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(100%, 920px);
      height: min(900px, calc(100vh - 48px));
      min-height: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255,255,255,.92);
    }

    .logo {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 20px;
      background: linear-gradient(135deg, var(--accent), #8c6ee8);
    }

    .title-wrap { min-width: 0; }

    h1 {
      margin: 0;
      font-size: clamp(18px, 3vw, 24px);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .purpose {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      margin: 0 0 18px;
    }

    .message-row.user { justify-content: flex-end; }

    .message {
      max-width: min(78%, 680px);
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .assistant .message {
      background: var(--assistant);
      border-bottom-left-radius: 6px;
    }

    .user .message {
      color: white;
      background: var(--user);
      border-bottom-right-radius: 6px;
    }

    .welcome {
      text-align: center;
      max-width: 620px;
      margin: 50px auto;
    }

    .welcome h2 { margin-bottom: 8px; }
    .welcome p { color: var(--muted); line-height: 1.6; }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      padding: 13px 16px;
      background: var(--assistant);
      border-radius: 18px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9299aa;
      animation: bounce 1.1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .55; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    .error {
      color: var(--danger);
      background: #fff1f0;
      border: 1px solid #ffd5d2;
    }

    form {
      border-top: 1px solid var(--border);
      padding: 16px;
      display: flex;
      gap: 10px;
      background: #fff;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 50px;
      max-height: 140px;
      border: 1px solid var(--border);
      border-radius: 16px;
      outline: none;
      padding: 14px 16px;
      font: inherit;
      color: var(--text);
      background: #fbfcfe;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91,91,214,.12);
    }

    button {
      align-self: flex-end;
      height: 50px;
      min-width: 88px;
      border: 0;
      border-radius: 15px;
      color: white;
      background: var(--accent);
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, background .15s;
    }

    button:hover:not(:disabled) {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    button:disabled { opacity: .55; cursor: not-allowed; }

    .hint {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding: 0 16px 12px;
    }

    @media (max-width: 640px) {
      body { padding: 0; }
      .app {
        width: 100%;
        height: 100vh;
        min-height: 0;
        border: 0;
        border-radius: 0;
      }
      header { padding: 16px; }
      #chat { padding: 18px 14px; }
      .message { max-width: 88%; }
      form { padding: 12px; }
      button { min-width: 72px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo" aria-hidden="true">AI</div>
      <div class="title-wrap">
        <h1>{{ chatbot_title }}</h1>
        <p class="purpose">{{ chatbot_purpose }}</p>
      </div>
    </header>

    <section id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <h2>How can I help?</h2>
        <p>Ask a question related to the chatbot's purpose. I can use the configured Firestore knowledge base and the conversation context to answer follow-up questions.</p>
      </div>
    </section>

    <form id="chat-form">
      <textarea id="message" rows="1" maxlength="8000"
        placeholder="Type your message..." aria-label="Message"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const welcome = document.getElementById("welcome");

    // Per-browser conversation memory. It is sent to Flask with every request.
    const history = [];

    function addMessage(role, text, isError = false) {
      if (welcome) welcome.remove();

      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "message" + (isError ? " error" : "");
      bubble.textContent = text;

      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return row;
    }

    function addTyping() {
      const row = document.createElement("div");
      row.className = "message-row assistant";
      row.id = "typing";

      const bubble = document.createElement("div");
      bubble.className = "typing";
      bubble.innerHTML = "<span></span><span></span><span></span>";

      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeTyping() {
      document.getElementById("typing")?.remove();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = input.value.trim();
      if (!message || send.disabled) return;

      addMessage("user", message);
      input.value = "";
      input.style.height = "auto";
      send.disabled = true;
      addTyping();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });

        const data = await response.json().catch(() => ({}));
        removeTyping();

        if (!response.ok) {
          throw new Error(data.error || "Request failed.");
        }

        const reply = String(data.reply || "").trim();
        if (!reply) throw new Error("The assistant returned an empty response.");

        addMessage("assistant", reply);
        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: reply });

        // Keep the browser payload bounded while retaining recent context.
        while (history.length > 20) history.shift();
      } catch (error) {
        removeTyping();
        addMessage("assistant", error.message || "Something went wrong.", true);
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });
  </script>
</body>
</html>
